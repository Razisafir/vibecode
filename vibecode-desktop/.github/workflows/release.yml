name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run test:system

  release:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # macOS code signing
      - name: Sign macOS build
        if: runner.os == 'macOS'
        run: |
          echo "Code signing would happen here"
          # security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # security import "$CERTIFICATE_PATH" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # codesign --deep --force --verify --verbose --sign "$SIGNING_IDENTITY" dist/mac/VibeCode.app
        env:
          SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}

      # Windows code signing
      - name: Sign Windows build
        if: runner.os == 'Windows'
        run: |
          echo "Code signing would happen here"
          # signtool sign /f "$CERTIFICATE_PATH" /p "$CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/win-unpacked/VibeCode.exe
        env:
          CERTIFICATE_PATH: ${{ secrets.WIN_CERTIFICATE_PATH }}

      - name: Package for distribution
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibecode-release-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
