<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeCode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 480px;
      height: 320px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: fadeIn 0.6s ease-out, pulse 2s ease-in-out infinite;
    }
    .logo svg {
      width: 100%;
      height: 100%;
    }
    h1 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      animation: fadeIn 0.6s ease-out 0.1s both;
    }
    .tagline {
      color: #6366f1;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
      animation: fadeIn 0.6s ease-out 0.2s both;
    }
    .loader {
      width: 120px;
      height: 3px;
      background: #1a1a2e;
      border-radius: 3px;
      overflow: hidden;
      animation: fadeIn 0.6s ease-out 0.3s both;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border-radius: 3px;
      animation: loading 1.5s ease-in-out infinite;
    }
    .version {
      position: absolute;
      bottom: 16px;
      color: #4a4a6a;
      font-size: 11px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#6366f1"/>
          <stop offset="100%" style="stop-color:#8b5cf6"/>
        </linearGradient>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#818cf8"/>
          <stop offset="100%" style="stop-color:#a78bfa"/>
        </linearGradient>
      </defs>
      <path d="M256 120 L396 320 L356 320 L256 180 L156 320 L116 320 Z" fill="url(#glow)" opacity="0.3"/>
      <path d="M256 140 L386 320 L346 320 L256 200 L166 320 L126 320 Z" fill="url(#accent)"/>
      <path d="M256 200 L326 320 L296 320 L256 260 L216 320 L186 320 Z" fill="url(#glow)" opacity="0.5"/>
      <circle cx="256" cy="340" r="16" fill="#6366f1"/>
      <circle cx="256" cy="340" r="8" fill="#818cf8"/>
    </svg>
  </div>
  <h1>VibeCode</h1>
  <p class="tagline">AI-Native Workspace</p>
  <div class="loader">
    <div class="loader-bar"></div>
  </div>
  <span class="version">v0.2.0</span>
</body>
</html>
