# Gitleaks Configuration — VibeCode Repository
# https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[[rules]]
id = "vibecode-env-database-url"
description = "Database URL in .env"
regex = '''DATABASE_URL=.*'''
tags = ["env", "database"]

[[allowlist]]
paths = [
  '''vibecode-desktop/\.env\.example$''',
  '''\.gitleaks\.toml$''',
  '''SECURITY\.md$''',
]

description = "Global allow list"
regexes = [
  '''your-api-key-here''',
  '''sk-\.\.\.''',
  '''OPENAI_API_KEY=$''',
  '''ANTHROPIC_API_KEY=$''',
  '''GOOGLE_API_KEY=$''',
]
