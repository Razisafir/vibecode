name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'vibecode-desktop/**'
  pull_request:
    branches: [main]
    paths:
      - 'vibecode-desktop/**'

defaults:
  run:
    working-directory: vibecode-desktop

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibecode-desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VIBECODE_E2E: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            vibecode-desktop/e2e-report/
            vibecode-desktop/test-results/
