name: Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Electron Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibecode-desktop/package-lock.json

      - name: Install dependencies
        working-directory: vibecode-desktop
        run: npm ci

      - name: Build application
        working-directory: vibecode-desktop
        run: npm run build

      - name: Package Electron (no publish)
        working-directory: vibecode-desktop
        run: npx electron-builder --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vibecode-linux-build
          path: vibecode-desktop/dist-electron/**/*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vibecode-windows-build
          path: vibecode-desktop/dist-electron/**/*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vibecode-macos-build
          path: vibecode-desktop/dist-electron/**/*
          retention-days: 7
          if-no-files-found: warn
