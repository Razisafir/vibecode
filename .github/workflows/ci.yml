name: Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'vibecode-desktop/**'
  pull_request:
    branches: [main]
    paths:
      - 'vibecode-desktop/**'

defaults:
  run:
    working-directory: vibecode-desktop

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibecode-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibecode-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: vibecode-desktop/coverage/

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibecode-desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Validate build output
        run: |
          test -f dist/main/main.js || exit 1
          test -f dist/preload/preload.js || exit 1
          test -f dist/renderer/index.html || exit 1

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibecode-desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibecode-${{ matrix.os }}
          path: vibecode-desktop/dist-electron/
