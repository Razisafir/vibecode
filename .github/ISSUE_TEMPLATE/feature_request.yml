name: Feature Request
description: Suggest a new feature or improvement for VibeCode
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please be specific about the
        problem you want solved and the solution you envision.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is currently difficult or impossible?
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? What should the user experience be?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you tried or considered?

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - AI / Provider Integration
        - Code Execution / Proposals
        - Memory / Context
        - UI / Editor
        - Terminal / Shell
        - File Explorer
        - Security / Sandbox
        - Performance
        - Configuration / Settings
        - Cross-platform
        - Other
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How would this feature affect your workflow?
      options:
        - Critical — I cannot use VibeCode without this
        - High — This would significantly improve my workflow
        - Medium — This would be a nice improvement
        - Low — This would be a minor convenience
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is a feature request, not a bug report
          required: true
